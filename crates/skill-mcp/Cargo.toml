[package]
name = "skill-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server over .skill containers: routing-plane search, lazy body loading, segment capability disclosure"

[dependencies]
skill-format = { path = "../skill-format" }
skillc = { path = "../skillc" }
anyhow = "1"
rmcp = { version = "3.1", features = ["transport-io", "server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
